# OWASP Top 10 Labs 2025 - Nexo
# Arquitectura de red aislada: web y db SIN salida a internet
#
# Redes:
#   public   - nginx puede responder a internet
#   frontend - nginx <-> web (internal)
#   backend  - web <-> db (internal)

services:
  nginx:
    image: nginx:alpine
    container_name: owasp-nginx-2025
    ports:
      # En desarrollo: usar 8082 (override agrega este)
      # En producción: descomentar estos y eliminar el override
      # - "80:80"
      # - "443:443"
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - public
      - frontend
    depends_on:
      - web
    restart: unless-stopped
    #
    # HARDENING: Nginx con privilegios mínimos
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                     # Para logs y pid file
      - SETUID                    # Para worker processes
      - SETGID                    # Para worker processes
      - NET_BIND_SERVICE          # Para bind a puertos < 1024 (80, 443)

  web:
    build: ./php
    container_name: owasp-web-2025
    volumes:
      - ./src:/var/www/html
    tmpfs:
      - /var/www/html/a02_admin/uploads:size=50m,mode=1777
      - /var/log/nexo:size=20m
    environment:
      - NEXO_DB_HOST=db
      - NEXO_DB_NAME=${NEXO_DB_NAME}
      - NEXO_DB_USER=${NEXO_DB_USER}
      - NEXO_DB_PASS=${NEXO_DB_PASS}
      - NEXO_ENV=${NEXO_ENV:-production}
    networks:
      frontend:
        ipv4_address: 172.30.0.10    # IP fija para reglas de firewall
      backend:
    depends_on:
      - db
    restart: unless-stopped
    # SIN ports expuestos - solo accesible via nginx
    # 
    # HARDENING: Limitar capabilities del contenedor
    # Aunque el lab es vulnerable, el contenedor tiene privilegios mínimos
    security_opt:
      - no-new-privileges:true    # Previene escalación de privilegios via setuid
    cap_drop:
      - ALL                       # Quita TODAS las capabilities por defecto
    cap_add:
      - CHOWN                     # Necesario para Apache (cambiar ownership de archivos)
      - SETUID                    # Necesario para Apache (cambiar a www-data)
      - SETGID                    # Necesario para Apache (cambiar grupo)
      - DAC_OVERRIDE              # Necesario para Apache (acceder a archivos)

  db:
    image: mariadb:10.11
    container_name: owasp-db-2025
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - nexo_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXO_DB_ROOT_PASS}
      - MYSQL_DATABASE=${NEXO_DB_NAME}
      - MYSQL_USER=${NEXO_DB_USER}
      - MYSQL_PASSWORD=${NEXO_DB_PASS}
    networks:
      - backend
    restart: unless-stopped
    # SIN ports expuestos - solo accesible desde web
    #
    # HARDENING: Privilegios mínimos para MariaDB
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                     # Necesario para inicialización de MariaDB
      - SETUID                    # Necesario para cambiar a usuario mysql
      - SETGID                    # Necesario para cambiar grupo
      - DAC_OVERRIDE              # Necesario para acceso a archivos de datos

  certbot:
    image: certbot/certbot
    container_name: owasp-certbot-2025
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Solo se ejecuta manualmente para obtener/renovar certs:
    # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d nexo.tudominio.com
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  public:
    driver: bridge
    internal: false   # nginx puede responder a internet
  frontend:
    driver: bridge
    internal: true    # nginx <-> web, aislado
    ipam:
      config:
        - subnet: 172.30.0.0/24    # Subnet fijo para reglas de iptables
  backend:
    driver: bridge
    internal: true    # web <-> db, aislado

volumes:
  nexo_db:
    name: owasp_nexo_db_2025
