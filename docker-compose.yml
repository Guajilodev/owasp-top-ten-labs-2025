# OWASP Top 10 Labs 2025 - Nexo
# Arquitectura de red aislada: web y db SIN salida a internet
#
# Redes:
#   public   - nginx puede responder a internet
#   frontend - nginx <-> web (internal)
#   backend  - web <-> db (internal)

services:
  nginx:
    image: nginx:alpine
    ports:
      # En desarrollo: usar 8082 (override agrega este)
      # En producción: descomentar estos y eliminar el override
      # - "80:80"
      # - "443:443"
      - "127.0.0.1:8082:80"
      - "[::1]:8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - public
      - frontend
    depends_on:
      - web
    restart: unless-stopped
    #
    # HARDENING: Nginx con privilegios mínimos
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                     # Para logs y pid file
      - SETUID                    # Para worker processes
      - SETGID                    # Para worker processes
      - NET_BIND_SERVICE          # Para bind a puertos < 1024 (80, 443)

  web:
    build: ./php
    # Compose-enforced containment limits. memswap_limit equal to mem_limit
    # disables swap-backed growth for this intentionally vulnerable service.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    volumes:
      - ./src:/var/www/html:ro
    tmpfs:
      # Apache, PHP sessions, and the secure-login rate limiter require /tmp.
      - /tmp:size=64m,mode=1777
      - /var/run/apache2:size=8m,mode=1777,uid=33,gid=33
      - /var/lock/apache2:size=8m,mode=1777,uid=33,gid=33
      - /var/log/apache2:size=16m,mode=1777,uid=33,gid=33
      - /var/www/html/a02_admin/uploads:size=50m,mode=1777
      # A09 deliberately exposes its log, but it must not be host-backed.
      - /var/www/html/a09_actividad/logs:size=20m,mode=1777
      - /var/log/nexo:size=20m,mode=0775,uid=33,gid=33
    environment:
      - NEXO_DB_HOST=${NEXO_DB_HOST}
      - NEXO_DB_NAME=${NEXO_DB_NAME}
      - NEXO_DB_USER=${NEXO_DB_USER}
      - NEXO_DB_PASS=${NEXO_DB_PASS}
      - NEXO_ENV=${NEXO_ENV:-production}
    networks:
      frontend:
      backend:
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    # SIN ports expuestos - solo accesible via nginx
    # 
    # HARDENING: Limitar capabilities del contenedor
    # Aunque el lab es vulnerable, el contenedor tiene privilegios mínimos
    security_opt:
      - no-new-privileges:true    # Previene escalación de privilegios via setuid
    cap_drop:
      - ALL                       # Quita TODAS las capabilities por defecto
    cap_add:
      - CHOWN                     # Necesario para Apache (cambiar ownership de archivos)
      - SETUID                    # Necesario para Apache (cambiar a www-data)
      - SETGID                    # Necesario para Apache (cambiar grupo)
      - DAC_OVERRIDE              # Necesario para Apache (acceder a archivos)

  db:
    image: mariadb:10.11
    # Bound database work that a compromised web service can induce while
    # leaving enough headroom for MariaDB's 128 MiB InnoDB buffer pool.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # The named volume keeps database data across container recreation.
      - nexo_db:/var/lib/mysql
    tmpfs:
      # Slow-query logs are disposable and bounded; database data stays on
      # the named volume above.
      - /var/log/mysql:size=32m,mode=2750,uid=999,gid=4
      - /tmp:size=32m,mode=1777
      - /run/mysqld:size=16m,mode=1777
    logging:
      # Bound Docker-managed stdout/stderr logs to avoid host disk exhaustion.
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXO_DB_ROOT_PASS}
      - MYSQL_DATABASE=${NEXO_DB_NAME}
      - MYSQL_USER=${NEXO_DB_USER}
      - MYSQL_PASSWORD=${NEXO_DB_PASS}
    networks:
      - backend
    restart: unless-stopped
    # SIN ports expuestos - solo accesible desde web
    #
    # HARDENING: Privilegios mínimos para MariaDB
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                     # Necesario para inicialización de MariaDB
      - SETUID                    # Necesario para cambiar a usuario mysql
      - SETGID                    # Necesario para cambiar grupo
      - DAC_OVERRIDE              # Necesario para acceso a archivos de datos

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Solo se ejecuta manualmente para obtener/renovar certs:
    # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d nexo.tudominio.com
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  public:
    driver: bridge
    internal: false   # nginx puede responder a internet
  frontend:
    driver: bridge
    internal: true    # nginx <-> web, aislado
  backend:
    driver: bridge
    internal: true    # web <-> db, aislado

volumes:
  nexo_db:
