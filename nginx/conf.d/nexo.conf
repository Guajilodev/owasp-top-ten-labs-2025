# Nexo Labs - Virtual Host
# Rate limiting dual: general (10r/m) y exploit (120r/m)
# La proteccion real es el aislamiento de red, no el rate limiting

# Upstream al contenedor web (Apache/PHP)
upstream web {
    server web:80;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL config - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/nexo.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexo.tudominio.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # NO agregamos CSP estricto porque queremos que XSS funcione en el lab A05

    # Labs que necesitan requests rapidos para la demo
    # A05 (SQLMap), A07 (Hydra/brute force), A10 (race condition)
    # La proteccion es el aislamiento de red - el contenedor no tiene salida a internet
    location ~ ^/(a05_clientes|a07_login|a10_pagos)/ {
        limit_req zone=exploit burst=50 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estaticos - sin rate limit agresivo
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=general burst=30 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demas - rate limit estricto
    location / {
        limit_req zone=general burst=5 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para labs lentos
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Bloquear acceso directo a logs (el lab A09 los expone via Apache, no Nginx)
    location ~ ^/logs/ {
        # El lab A09 expone logs intencionalmente via la app
        # pero no queremos que Nginx los sirva directamente
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

