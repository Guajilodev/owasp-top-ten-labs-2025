# ============================================
# Nexo Labs - Config para DESARROLLO LOCAL
# Sin SSL, sin HTTPS, puerto 80 directo
# ============================================

upstream web {
    server web:80;
}

server {
    listen 80;
    server_name localhost;

    # Labs que necesitan requests rápidos para la demo
    # A05 (SQLMap), A07 (Hydra/brute force), A10 (race condition)
    location ~ ^/(a05_clientes|a07_login|a10_pagos)/ {
        limit_req zone=exploit burst=50 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=general burst=30 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
    }

    # Todo lo demás
    location / {
        limit_req zone=general burst=5 nodelay;

        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
