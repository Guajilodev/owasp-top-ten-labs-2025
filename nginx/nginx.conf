# Nginx principal - OWASP Top 10 Labs 2025
# Este archivo solo define globals. La config de Nexo está en conf.d/nexo.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers globales
    server_tokens off;

    # Gzip - minimo para HTML/CSS/JS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones - definidas aqui, usadas en nexo.conf
    # general: browsing normal (2r/s = 120r/m, suficiente para navegar sin 503s)
    # exploit: labs A05/A07/A10 que necesitan requests rapidos para demos
    limit_req_zone $binary_remote_addr zone=general:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=exploit:10m rate=30r/s;

    # Incluir configs de sites
    include /etc/nginx/conf.d/*.conf;
}
